<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>新規登録</title></head>
<body>
    <h2>新規チーム登録</h2>
    <form action="/premier" method="POST">
        コード: <input type="text" name="code" required><br>
        チーム名: <input type="text" name="name" required><br>
        都市: <input type="text" name="city"><br>
        収容人数: <input type="number" name="capacity"><br>
        順位: <input type="number" name="rank"><br>
        <input type="submit" value="登録">
    </form>
</body>
</html>
